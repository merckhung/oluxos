name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { smp: 4, gic: 2, cpu: cortex-a72 }
          - { smp: 1, gic: 2, cpu: cortex-a72 }
          - { smp: 4, gic: 3, cpu: max }
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-system-arm qemu-user python3 make bzip2 mtools dosfstools e2fsprogs
      - name: Build kernel, userspace and images
        run: make -j"$(nproc)" all out/disk.img
      - name: Host unit tests (ASan/UBSan, DTB fuzzing)
        if: matrix.smp == 4 && matrix.gic == 2
        run: make unit-test
      - name: QEMU integration tests
        run: python3 tests/qemu/run_tests.py --out out --smp ${{ matrix.smp }} --gic ${{ matrix.gic }} --cpu ${{ matrix.cpu }}
      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-logs-smp${{ matrix.smp }}-gic${{ matrix.gic }}
          path: out/test-logs/

  raspberry-pi-4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-system-arm python3 make bzip2 mtools dosfstools e2fsprogs
      - name: Install QEMU 9.2 (raspi4b machine)
        run: sudo scripts/ci/install-qemu9.sh
      - name: Build kernel, userspace and Pi 4 boot files
        run: make -j"$(nproc)" && make out/disk.img sdcard
      - name: QEMU raspi4b integration tests
        run: sudo python3 tests/qemu/run_tests.py --out out --machine raspi4b --qemu qemu9-aarch64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpi4-boot-files
          path: |
            out/rpi4/
            out/sdcard.img
            out/test-logs/

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck gcc-aarch64-linux-gnu clang-format
      - name: cppcheck
        run: |
          cppcheck --error-exitcode=1 --enable=warning,portability --inline-suppr --std=c11 \
            -I include -I arch/arm64/include -D__KERNEL__ -DOLUX_VERSION='"ci"' -DOLUX_GITREV='"ci"' \
            --suppress=unknownMacro --suppress=syntaxError -q kernel mm fs lib drivers arch/arm64 net
      - name: clang-format check
        run: |
          git ls-files '*.c' '*.h' | grep -v '^legacy/' | grep -v '^third_party/' | \
            xargs clang-format --dry-run --Werror --style=file 2>&1 | head -50 || true

  cross-toolchain:
    # The from-source toolchain takes ~30 minutes: run on demand and weekly.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bison flex texinfo
      - run: toolchains/cross/build-cross-gcc.sh
      - run: make CROSS=$PWD/toolchains/cross/install/bin/aarch64-linux-musl-
