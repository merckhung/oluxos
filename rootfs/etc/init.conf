# OluxOS init configuration: <action> <command line>
#   sysinit  - run once at boot, in order, before anything else
#   once     - start once, not restarted
#   respawn  - start and restart when it exits (with back-off; exit status 78 = give up)
#   console  - like respawn, attached to the console as a login session
#   shutdown - run at power-off/reboot, in order
sysinit  /etc/init.d/rcS
# userspace filesystem servers (exit 78 = no such device/filesystem: not restarted)
respawn  /sbin/fatfsd /dev/vda1 /mnt/fat
respawn  /sbin/ext4fsd /dev/vda2 /mnt/ext
# Raspberry Pi SD card: boot partition (the running slot on A/B cards) at
# /boot, data partition at /data; an ext4 second partition at /mnt/ext
respawn  /sbin/mount-sd boot
respawn  /sbin/mount-sd data
respawn  /sbin/ext4fsd /dev/mmcblk0p2 /mnt/ext
# A/B updates: a trial boot that stays up becomes the default slot
once     /sbin/olux-update confirm
# system log (/var/log/messages, rotated at 200 KiB) and the SSH server
respawn  /sbin/syslogd -n -s 200 -b 1
respawn  /usr/sbin/dropbear -F -R -p 22
# time synchronisation (servers in /etc/ntp.conf)
respawn  /usr/sbin/ntp-client
console  /bin/sh -l
shutdown /etc/init.d/rcK
